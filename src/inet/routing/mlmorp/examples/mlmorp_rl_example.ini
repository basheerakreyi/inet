# MLMORP with Online Reinforcement Learning - Example Configuration
# This file demonstrates how to configure MLMORP with RL capabilities

[General]
network = MlmorpNetworkExample
sim-time-limit = 300s
seed-set = ${repetition}

# Enable detailed logging for RL
**.routingProtocol[*].useOnlineRL = true

[Config Baseline]
# Traditional MLMORP without ML
description = "Baseline MLMORP without machine learning"

*.host[*].routingTable.routingProtocol[*].useDNNRouting = false
*.host[*].routingTable.routingProtocol[*].useDNNforRoutingCost = false
*.host[*].routingTable.routingProtocol[*].useOnlineRL = false

# Traditional cost weights
*.host[*].routingTable.routingProtocol[*].alpha = 0.4  # Hop count weight
*.host[*].routingTable.routingProtocol[*].beta = 0.3   # Energy weight  
*.host[*].routingTable.routingProtocol[*].gamma = 0.3  # Bandwidth weight

[Config OfflineDNN]
# MLMORP with offline-trained DNN
description = "MLMORP with pre-trained DNN model"

*.host[*].routingTable.routingProtocol[*].useDNNRouting = true
*.host[*].routingTable.routingProtocol[*].useDNNforRoutingCost = false
*.host[*].routingTable.routingProtocol[*].useOnlineRL = false

# DNN model configuration
*.host[*].routingTable.routingProtocol[*].dnnInputSize = 5
*.host[*].routingTable.routingProtocol[*].dnnHiddenSize1 = 12
*.host[*].routingTable.routingProtocol[*].dnnHiddenSize2 = 6
*.host[*].routingTable.routingProtocol[*].dnnClassification = true
*.host[*].routingTable.routingProtocol[*].dnnModelFile = "model_training/trained_model.txt"

[Config OnlineRL]
# MLMORP with online reinforcement learning
description = "MLMORP with online DQN reinforcement learning"

*.host[*].routingTable.routingProtocol[*].useDNNRouting = false
*.host[*].routingTable.routingProtocol[*].useDNNforRoutingCost = false
*.host[*].routingTable.routingProtocol[*].useOnlineRL = true

# RL update configuration
*.host[*].routingTable.routingProtocol[*].rlUpdateInterval = 10  # Update every 10 packets

# DQN model architecture
*.host[*].routingTable.routingProtocol[*].dqnStateSize = 5
*.host[*].routingTable.routingProtocol[*].dqnHiddenSize1 = 64
*.host[*].routingTable.routingProtocol[*].dqnHiddenSize2 = 32
*.host[*].routingTable.routingProtocol[*].dqnMaxActions = 10

# Learning parameters
*.host[*].routingTable.routingProtocol[*].dqnLearningRate = 0.001
*.host[*].routingTable.routingProtocol[*].dqnEpsilon = 1.0      # Start with full exploration
*.host[*].routingTable.routingProtocol[*].dqnGamma = 0.95       # Discount factor

# Optional: Load pre-trained DQN model for faster convergence
# *.host[*].routingTable.routingProtocol[*].dqnModelFile = "model_training/trained_dqn_model.txt"

# Packet tracking configuration
*.host[*].routingTable.routingProtocol[*].packetTrackingTimeout = 10s
*.host[*].routingTable.routingProtocol[*].maxTrackingHistory = 1000

# Reward function parameters
*.host[*].routingTable.routingProtocol[*].successReward = 1.0
*.host[*].routingTable.routingProtocol[*].failureReward = -1.0
*.host[*].routingTable.routingProtocol[*].energyWeight = 0.1    # Energy penalty weight
*.host[*].routingTable.routingProtocol[*].delayWeight = 0.01    # Delay penalty weight

[Config OnlineRLPreTrained]
# MLMORP with online RL starting from pre-trained model
description = "MLMORP with online RL initialized from pre-trained DQN"
extends = OnlineRL

# Load pre-trained model for faster convergence
*.host[*].routingTable.routingProtocol[*].dqnModelFile = "model_training/trained_dqn_model.txt"

# Start with less exploration since we have a pre-trained model
*.host[*].routingTable.routingProtocol[*].dqnEpsilon = 0.3

[Config Comparison]
# Run multiple configurations for comparison
description = "Compare different MLMORP configurations"

# This will run all configurations defined above
# Use with: omnetpp -c Comparison -r 0..2

# You can also define specific parameter sweeps here
# For example, test different learning rates:
# *.host[*].routingTable.routingProtocol[*].dqnLearningRate = ${lr=0.0001, 0.001, 0.01}

# Network topology parameters (adjust based on your network)
*.numHosts = 20
*.host[*].mobility.typename = "RandomWaypointMobility"
*.host[*].mobility.speed = uniform(1mps, 3mps)
*.host[*].mobility.waitTime = uniform(5s, 15s)

# Energy configuration
*.host[*].energyStorage.typename = "IdealEpEnergyStorage"
*.host[*].energyStorage.nominalCapacity = 10000J

# Radio configuration
*.host[*].wlan[*].radio.transmitter.power = 20mW
*.host[*].wlan[*].radio.receiver.sensitivity = -85dBm

# Traffic configuration
*.host[0].app[0].typename = "UdpBasicApp"
*.host[0].app[0].destAddresses = "host[19]"  # Send to last host
*.host[0].app[0].destPort = 5000
*.host[0].app[0].messageLength = 512B
*.host[0].app[0].sendInterval = exponential(1s)
*.host[0].app[0].startTime = uniform(10s, 15s)

*.host[19].app[0].typename = "UdpSink"
*.host[19].app[0].localPort = 5000

